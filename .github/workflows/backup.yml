name: Nightly database backup

# pg_dump of each app database (Neon), restored into a throwaway PostgreSQL 17 to prove the dump is
# usable, then encrypted (AES-256, BACKUP_PASSPHRASE secret) and kept as a private workflow artifact
# for 14 days. Neon's own point-in-time history is the first line of recovery; this is the second.
# Restore: download the artifact, `openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in X.dump.enc -out X.dump`,
# then `pg_restore --clean --no-owner -d "$DATABASE_URL" X.dump`.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-drill-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CHANGEKITE: ${{ secrets.DATABASE_URL_CHANGEKITE }}
      DB_GRIDRINSE: ${{ secrets.DATABASE_URL_GRIDRINSE }}
      DB_WEBHOOKTRAIL: ${{ secrets.DATABASE_URL_WEBHOOKTRAIL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Dump, restore-check and encrypt each database
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret missing"; exit 1; }
          mkdir -p out && chmod 700 out
          pg="docker run --rm --network host -v $PWD/out:/out postgres:17"
          stamp=$(date -u +%Y%m%dT%H%MZ)
          for app in changekite gridrinse webhooktrail; do
            var="DB_${app^^}"; url="${!var}"
            test -n "$url" || { echo "missing database secret for $app"; exit 1; }
            $pg pg_dump --format=custom --no-owner --no-privileges --file "/out/$app.dump" "$url"
            size=$(stat -c %s "out/$app.dump")
            # Restore drill: load into the throwaway server and count tables and rows of _migrations.
            $pg psql -q "postgres://postgres:restore-drill-only@localhost:5432/postgres" -c "DROP DATABASE IF EXISTS drill; CREATE DATABASE drill;"
            $pg pg_restore --no-owner --no-privileges -d "postgres://postgres:restore-drill-only@localhost:5432/drill" "/out/$app.dump"
            tables=$($pg psql -At "postgres://postgres:restore-drill-only@localhost:5432/drill" -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
            migrations=$($pg psql -At "postgres://postgres:restore-drill-only@localhost:5432/drill" -c "SELECT count(*) FROM _migrations")
            echo "$app: dump ${size} bytes, restored ${tables} tables, ${migrations} migrations"
            test "$tables" -ge 5 && test "$migrations" -ge 1
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in "out/$app.dump" -out "out/$app-$stamp.dump.enc"
            rm -f "out/$app.dump"
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: out/*.enc
          retention-days: 14
          if-no-files-found: error
