name: Growth metrics

# Daily GridRinse numbers (counts only) committed to docs/growth/metrics.json, which the sales agent reads
# (docs/growth/AGENT.md). Runs an hour before the agent. Commits made with GITHUB_TOKEN do not start CI or deploys.
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Collect
        env:
          DATABASE_URL_GRIDRINSE: ${{ secrets.DATABASE_URL_GRIDRINSE }}
          WORKER_SECRETS_GRIDRINSE: ${{ secrets.WORKER_SECRETS_GRIDRINSE }}
        run: |
          export STRIPE_SECRET_KEY="$(node -e 'process.stdout.write(JSON.parse(process.env.WORKER_SECRETS_GRIDRINSE).STRIPE_SECRET_KEY||"")')"
          echo "::add-mask::$STRIPE_SECRET_KEY"
          npx tsx scripts/growth-metrics.mts
      - name: Commit
        run: |
          git config user.name "growth-metrics[bot]"
          git config user.email "growth-metrics@users.noreply.github.com"
          git add docs/growth/metrics.json
          git diff --cached --quiet && exit 0
          git commit -m "growth: daily metrics [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
