# Fly.io config for hookpilot. NOT deployed: needs the owner's Fly account and authorization.
# Deploy from the repo root:  fly deploy --config deploy/fly/hookpilot.toml --dockerfile Dockerfile
# Secrets (never in this file):  fly secrets set DATABASE_URL=... SESSION_SECRET=... CRON_SECRET=... #   STRIPE_SECRET_KEY=sk_test_... STRIPE_WEBHOOK_SECRET=whsec_... RESEND_API_KEY=... OWNER_ALERT_EMAIL=...
app = "hookpilot-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"
  [build.args]
    APP = "hookpilot"

[env]
  PORT = "8080"
  TRUSTED_PROXY = "fly"        # client IP comes from Fly-Client-IP, set by Fly's edge
  RUN_SCHEDULER = "1"          # in-process scheduler tick every 60 s (ticks are safe to run concurrently)
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # scheduled jobs and webhook capture need an always-on machine
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
